name: MoviesApp
options:
  bundleIdPrefix: com.yourcompany
targets:
  MoviesApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # مفتاح TMDB API — يُستبدل تلقائياً أثناء البناء بقيمة متغيّر البيئة
        # TMDB_API_KEY الممرر لـ xcodebuild (انظر .github/workflows/build-ipa.yml)
        TMDBAPIKey: "$(TMDB_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.moviesapp
        PRODUCT_NAME: MoviesApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        # تُستبدل قيمتها الفعلية عبر build setting override من سطر أوامر xcodebuild
        TMDB_API_KEY: ""
